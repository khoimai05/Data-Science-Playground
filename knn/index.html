<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>K-Nearest Neighbors</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Sora:wght@400;600&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; }
    body {
      font-family: 'Sora', sans-serif; background: #0a0a0a; color: #d4d4d4;
      min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 2rem;
    }
    .header { text-align: center; margin-bottom: 1.5rem; }
    .header a { font-family: 'JetBrains Mono', monospace; color: #444; font-size: 0.75rem; text-decoration: none; transition: color 0.2s; }
    .header a:hover { color: #888; }
    h1 { font-size: 1.1rem; font-weight: 600; color: #fff; margin: 0.5rem 0 0.15rem; }
    .subtitle { font-family: 'JetBrains Mono', monospace; font-size: 0.72rem; color: #444; }
    .main { display: flex; gap: 1.5rem; align-items: flex-start; flex-wrap: wrap; justify-content: center; margin-bottom: 1.25rem; }
    .canvas-wrap { border: 1px solid #1a1a1a; border-radius: 6px; padding: 1rem; transition: border-color 0.3s; }
    .canvas-wrap:hover { border-color: #2a2a2a; }
    .info { max-width: 300px; border-left: 1px solid #1a1a1a; padding-left: 1.5rem; }
    .info h2 { font-size: 0.8rem; font-weight: 600; color: #888; margin-bottom: 0.6rem; text-transform: uppercase; letter-spacing: 0.05em; }
    .info p { font-size: 0.78rem; line-height: 1.65; color: #555; margin-bottom: 0.6rem; }
    canvas { display: block; cursor: crosshair; border-radius: 4px; background: #0e0e0e; }
    .controls { display: flex; gap: 0.6rem; align-items: center; flex-wrap: wrap; justify-content: center; }
    .toggle { display: flex; border: 1px solid #222; border-radius: 4px; overflow: hidden; }
    .toggle button { font-family: 'JetBrains Mono', monospace; padding: 0.4rem 0.7rem; font-size: 0.72rem; border: none; cursor: pointer; background: transparent; color: #444; transition: color 0.15s, background 0.15s; }
    .toggle button.active { color: #fff; }
    .toggle button:first-child.active { background: rgba(96,165,250,0.2); color: #93c5fd; }
    .toggle button:last-child.active { background: rgba(248,113,113,0.2); color: #fca5a5; }
    button { font-family: 'JetBrains Mono', monospace; padding: 0.45rem 1rem; font-size: 0.75rem; font-weight: 500; border: 1px solid #222; border-radius: 4px; background: transparent; color: #666; cursor: pointer; transition: color 0.15s, border-color 0.15s; }
    button:hover { color: #bbb; border-color: #444; }
    button:active { transform: scale(0.97); }
    label { font-family: 'JetBrains Mono', monospace; font-size: 0.75rem; color: #555; }
    #kValue { font-family: 'JetBrains Mono', monospace; font-size: 0.75rem; display: inline-block; min-width: 1.2em; text-align: center; color: #888; }
    input[type="range"] { width: 70px; height: 4px; -webkit-appearance: none; appearance: none; background: #222; border-radius: 2px; cursor: pointer; }
    input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 12px; height: 12px; border-radius: 50%; background: #555; cursor: pointer; }
    input[type="range"]::-webkit-slider-thumb:hover { background: #888; }
    input[type="range"]::-moz-range-thumb { width: 12px; height: 12px; border: none; border-radius: 50%; background: #555; cursor: pointer; }
    select { font-family: 'JetBrains Mono', monospace; padding: 0.4rem 0.6rem; font-size: 0.72rem; background: #0e0e0e; color: #888; border: 1px solid #222; border-radius: 4px; cursor: pointer; }
    select:hover { border-color: #444; }
    select:focus { outline: none; border-color: #555; }
    .msg { font-family: 'JetBrains Mono', monospace; font-size: 0.72rem; color: #555; }
    .msg:empty { display: none; }
    @media (max-width: 700px) { .info { border-left: none; padding-left: 0; border-top: 1px solid #1a1a1a; padding-top: 1rem; max-width: 100%; } }
  </style>
</head>
<body>
  <header class="header">
    <a href="../">← back</a>
    <h1>k-nearest neighbors</h1>
    <p class="subtitle">add points, adjust k</p>
  </header>
  <div class="main">
    <div class="canvas-wrap">
      <canvas id="plot" width="520" height="420"></canvas>
    </div>
    <article class="info">
      <h2>How it works</h2>
      <p>No training. To predict a new point, find the K closest labeled neighbors and take a majority vote.</p>
      <p>Small K = flexible but noisy. Large K = smooth but may miss detail. Try both.</p>
    </article>
  </div>
  <div class="controls">
    <div class="toggle">
      <button id="class0Btn" class="active">class 0</button>
      <button id="class1Btn">class 1</button>
    </div>
    <button id="sampleClusters">sample</button>
    <label>k:</label>
    <input type="range" id="kSlider" min="1" max="15" value="5">
    <span id="kValue">5</span>
    <label>dist:</label>
    <select id="distanceSelect">
      <option value="euclidean">euclidean</option>
      <option value="manhattan">manhattan</option>
    </select>
    <button id="clearBtn">clear</button>
    <span class="msg" id="message"></span>
  </div>
  <script src="app.js"></script>
</body>
</html>
